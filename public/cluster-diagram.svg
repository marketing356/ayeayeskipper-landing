<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Arial,Helvetica,sans-serif">
<rect width="900" height="420" fill="#0b1a2b"/>
<text x="450" y="38" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">One cluster. One operating system.</text>
<circle cx="450" cy="225" r="150" fill="none" stroke="#14b8a6" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="360" y="195" width="180" height="60" rx="12" fill="#14b8a6"/>
<text x="450" y="222" fill="#06202b" font-size="16" font-weight="700" text-anchor="middle">Skipper</text>
<text x="450" y="242" fill="#06202b" font-size="12" text-anchor="middle">shared boats, trailers, contracts</text>
<g fill="#16314d" stroke="#14b8a6" stroke-width="1.5">
<rect x="360" y="85" width="180" height="48" rx="10"/><rect x="170" y="290" width="180" height="48" rx="10"/><rect x="550" y="290" width="180" height="48" rx="10"/></g>
<g fill="#fff" font-size="14" text-anchor="middle"><text x="450" y="114">Marina A</text><text x="260" y="319">Marina B</text><text x="640" y="319">Marina C</text></g>
<g stroke="#14b8a6" stroke-width="2"><line x1="450" y1="133" x2="450" y2="195"/><line x1="320" y1="290" x2="400" y2="255"/><line x1="580" y1="290" x2="500" y2="255"/></g>
<text x="450" y="392" fill="#9fb3c8" font-size="13" text-anchor="middle">A boat moves between marinas. Its record, trailer and contract move with it. No re-entry.</text>
</svg>
